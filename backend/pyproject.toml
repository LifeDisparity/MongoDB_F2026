[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "living-atlas"
version = "0.0.1"
description = "Persistent scientific investigation and evaluated harness adaptation"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
runtime = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2",
  "pymongo>=4.12,<4.19",
  "langgraph>=1,<2",
  "langgraph-checkpoint-mongodb==0.5.0",
  "openai",
  "pronto",
  "huggingface-hub"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["living_atlas*"]
